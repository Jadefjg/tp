services:
  mysql:
    image: mysql:8.0
    container_name: tp-mysql
    restart: unless-stopped
    environment:
      TZ: Asia/Shanghai
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-testplatform}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testplatform}
      MYSQL_USER: ${MYSQL_USER:-testplatform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testplatform}
    command: >
      --default-authentication-plugin=mysql_native_password
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_unicode_ci
      --skip-character-set-client-handshake
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    networks:
      - tp-net

  redis:
    image: redis:6.2-alpine
    container_name: tp-redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    networks:
      - tp-net

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: tp-app:latest
    container_name: tp-app
    restart: unless-stopped
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${TP_PORT:-18081}:8081"
    environment:
      TZ: Asia/Shanghai
      TP_DEBUG: ${TP_DEBUG:-false}
      TP_PORT: 8081
      TP_WORKERS: ${TP_WORKERS:-1}
      TP_RUNNER_PER_WORKER: ${TP_RUNNER_PER_WORKER:-20}
      TP_HOST: ${TP_HOST:-localhost:9528}
      TP_GENERATE_SCHEMAS: ${TP_GENERATE_SCHEMAS:-true}
      TP_INIT_DEBUG_DATA: ${TP_INIT_DEBUG_DATA:-false}
      TP_ADMIN_USER: ${TP_ADMIN_USER:-admin}
      TP_ADMIN_PASSWORD: ${TP_ADMIN_PASSWORD:-admin123}
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: ${MYSQL_USER:-testplatform}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:-testplatform}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-testplatform}
      REDIS_URL: redis://redis:6379/0
    volumes:
      - media_data:/app/media
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import socket; socket.create_connection(('127.0.0.1', 8081), 3).close()",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 25s
    networks:
      - tp-net

volumes:
  mysql_data:
  redis_data:
  media_data:

networks:
  tp-net:
    driver: bridge
